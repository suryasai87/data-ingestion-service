resources:
  postgres_projects:
    # the service's store: requests, versions, approvals, audit, policies, admins, forecast model, snapshots
    dis_store:
      project_id: ${var.lakebase_project}
      display_name: ${var.lakebase_project}
      pg_version: 17
      default_endpoint_settings:
        autoscaling_limit_min_cu: 0.5
        autoscaling_limit_max_cu: 2
        suspend_timeout_duration: 3600s
      lifecycle:
        prevent_destroy: true   # holds the approval trail and audit log
    # demo source system: an "ERP" Postgres the PostgreSQL connector replicates from (pgoutput logical replication)
    dis_source:
      project_id: ${var.source_project}
      display_name: ${var.source_project}
      pg_version: 17
      enable_pg_native_login: true   # the replication role signs in with a password (stored in the secret scope)
      default_endpoint_settings:
        autoscaling_limit_min_cu: 0.5
        autoscaling_limit_max_cu: 2
        suspend_timeout_duration: 3600s
